name: CodeProof verification
run-name: CodeProof · ${{ inputs.run_id }}
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: codeproof-${{ inputs.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out trusted verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tooling
          persist-credentials: false
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.head_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Execute checks in disposable containers
        working-directory: source
        run: |
          set +e
          node ../tooling/.codeproof/runner.cjs scan --execute --docker --json > ../runner-output.log
          result=$?
          set -e
          if [ "$result" -gt 1 ]; then
            cat ../runner-output.log
            exit "$result"
          fi
      - name: Attach trusted job identity
        env:
          CODEPROOF_RUN_ID: ${{ inputs.run_id }}
          CODEPROOF_REPOSITORY_ID: ${{ github.repository_id }}
          CODEPROOF_ACTION_RUN_ID: ${{ github.run_id }}
        run: node tooling/.codeproof/envelope.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeproof-${{ inputs.run_id }}
          path: codeproof-envelope.json
          if-no-files-found: error
          retention-days: 7
